<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card-brand p-4">
        <h1 class="page-title h3">Neue Übung anlegen</h1>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control" formControlName="name" />
            @if (form.controls.name.invalid && form.controls.name.touched) {
              <div class="form-text text-danger">2-80 Zeichen erforderlich.</div>
            }
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Kategorie</label>
            <select id="category" class="form-select" formControlName="category">
              @for (cat of categories; track cat) {
                <option [value]="cat">{{ cat }}</option>
              }
            </select>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Beschreibung (optional)</label>
            <textarea
              id="description"
              class="form-control"
              rows="3"
              formControlName="description"
            ></textarea>
          </div>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
          }

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-brand" [disabled]="saving()">
              @if (saving()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              Speichern
            </button>
            <a routerLink="/exercises" class="btn btn-outline-brand">Abbrechen</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
