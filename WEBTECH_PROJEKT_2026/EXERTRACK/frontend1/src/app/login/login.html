<div class="container auth-container">
    <div class="col-12 col-sm-10 col-md-7 col-lg-6">
        <div class="card-brand p-4">
            <h1 class="page-title h1">Login</h1>

            <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
                
                <div class="mb-3">
            <label for="username" class="form-label">Benutzername</label>
            <input
              id="username"
              type="text"
              class="form-control"
              formControlName="username"
              autocomplete="username"
                />

        @if (form.controls.username.invalid && form.controls.username.touched) {
              <div class="form-text text-danger">Mindestens 3 Zeichen.</div>
            }
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Passwort</label>
            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              autocomplete="current-password"
            />
            @if (form.controls.password.invalid && form.controls.password.touched) {
              <div class="form-text text-danger">Mindestens 6 Zeichen.</div>
            }
          </div>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
          }

          <button type="submit" class="btn btn-brand w-100" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Einloggen
          </button>
        </form>

        <p class="mt-3 mb-0 text-center small">
          Noch kein Konto? <a routerLink="/register">Jetzt registrieren</a>
        </p>
      </div>
    </div>
  </div>
</div>
